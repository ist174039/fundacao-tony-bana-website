name: Platform quality gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Unit tests and Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      FTB_SCHOOLS_ENABLED: "false"
      FTB_MATERIAL_DONATIONS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:security
      - name: Test operational workspaces and access policies
        run: node --test tests/github-project-sync.test.mjs tests/student-registry.test.mjs tests/student-private.test.mjs tests/access-grants.test.mjs tests/document-library.test.mjs tests/document-workspace.test.mjs tests/material-delivery.test.mjs tests/module-registry.test.mjs tests/audit-log.test.mjs tests/public-media-policy.test.mjs tests/audit-coverage.test.mjs tests/security-readiness.test.mjs tests/social-assessment.test.mjs
      - name: Verify user manual coverage, roles and workflow data
        run: node --test tests/platform-manual.test.mjs
      - run: npm run test:market
      - name: Audit market readiness without triggering a release
        run: npm run audit:market -- --sha "$GITHUB_SHA"
      - run: npm run build
      - name: Smoke fail-closed private modules without credentials
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/ftb-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          status=""
          for attempt in $(seq 1 45); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3100/platform/login || true)
            if [ "$status" = "200" ]; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Next.js exited before the smoke test was ready"
              exit 1
            fi
            sleep 1
          done
          if [ "$status" != "200" ]; then
            echo "Platform login did not become ready (HTTP $status)"
            exit 1
          fi
          for endpoint in /api/area/schools /api/area/material-receptions; do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:3100$endpoint")
            if [ "$status" != "503" ]; then
              echo "Fail-closed smoke rejected: $endpoint returned HTTP $status instead of 503"
              exit 1
            fi
          done

  firestore-emulator:
    name: Firestore Emulator (material & security)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      GCLOUD_PROJECT: demo-ftb-test
      GOOGLE_CLOUD_PROJECT: demo-ftb-test
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FTB_SCHOOLS_ENABLED: "false"
      FTB_MATERIAL_DONATIONS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Run isolated Firestore Emulator integration tests
        run: npx --yes firebase-tools@14.24.0 emulators:exec --project demo-ftb-test --only firestore --config firebase.emulator.json "node --test tests/firestore-emulator.test.mjs tests/material-delivery-emulator.test.mjs tests/audit-emulator.test.mjs"
      - name: Test candidate Firestore public and private access rules
        run: npx --yes firebase-tools@14.24.0 emulators:exec --project demo-ftb-test --only firestore --config tests/firebase/candidate-emulator.json "node --test tests/firebase-candidate-emulator.test.mjs"
      - name: Test candidate Storage Rules for existing shared bucket
        env:
          FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
          STORAGE_EMULATOR_HOST: 127.0.0.1:9199
        run: npx --yes firebase-tools@14.24.0 emulators:exec --project demo-ftb-test --only storage --config tests/firebase/candidate-storage-emulator.json "node --test tests/firebase-candidate-storage-emulator.test.mjs"
