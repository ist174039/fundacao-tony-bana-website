name: Platform quality gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Unit tests and Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      FTB_SCHOOLS_ENABLED: "false"
      FTB_MATERIAL_DONATIONS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:security
      - name: Test operational workspaces and access policies
        run: node --test tests/github-project-sync.test.mjs tests/student-registry.test.mjs tests/student-private.test.mjs tests/access-grants.test.mjs tests/document-library.test.mjs tests/document-workspace.test.mjs tests/material-delivery.test.mjs tests/module-registry.test.mjs tests/audit-log.test.mjs tests/public-media-policy.test.mjs tests/audit-coverage.test.mjs tests/security-readiness.test.mjs tests/family-assessment.test.mjs tests/family-assessment-private.test.mjs tests/school-delivery-selection.test.mjs tests/stock-summary.test.mjs tests/audit-actor.test.mjs
      - run: npm run test:market
      - name: Audit market readiness without triggering a release
        run: npm run audit:market -- --sha "$GITHUB_SHA"
      - run: npm run build

  firestore-emulator:
    name: Firestore Emulator (material & security)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      GCLOUD_PROJECT: demo-ftb-test
      GOOGLE_CLOUD_PROJECT: demo-ftb-test
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FTB_SCHOOLS_ENABLED: "false"
      FTB_MATERIAL_DONATIONS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Run isolated Firestore Emulator integration tests
        run: npx --yes firebase-tools@14.24.0 emulators:exec --project demo-ftb-test --only firestore --config firebase.emulator.json "node --test tests/firestore-emulator.test.mjs tests/material-delivery-emulator.test.mjs tests/audit-emulator.test.mjs tests/family-assessment-emulator.test.mjs"
      - name: Test candidate Firestore public and private access rules
        run: npx --yes firebase-tools@14.24.0 emulators:exec --project demo-ftb-test --only firestore --config tests/firebase/candidate-emulator.json "node --test tests/firebase-candidate-emulator.test.mjs"
      - name: Test candidate Storage Rules for existing shared bucket
        env:
          FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
          STORAGE_EMULATOR_HOST: 127.0.0.1:9199
        run: npx --yes firebase-tools@14.24.0 emulators:exec --project demo-ftb-test --only storage --config tests/firebase/candidate-storage-emulator.json "node --test tests/firebase-candidate-storage-emulator.test.mjs"
