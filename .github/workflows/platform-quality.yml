name: Platform quality gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Unit tests and Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      FTB_SCHOOLS_ENABLED: "false"
      FTB_MATERIAL_DONATIONS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:security
      - run: npm run build
